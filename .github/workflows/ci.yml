name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: ./scripts/format.sh --check

  linux-debug-gcc:
    name: Linux Debug (GCC)
    runs-on: ubuntu-latest
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v5
        with:
          path: |
            build/debug/_deps
            ~/.cache/ccache
          key: cmake-deps-${{ runner.os }}-gcc-debug-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-gcc-
            cmake-deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-12 g++-12 libomp-dev

      - name: Configure
        run: cmake --preset=debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test (benchmark label excluded via test preset)
        run: ctest --preset=debug

  sanitizers:
    name: Sanitizers (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # asan/ubsan use the default system compiler; the tsan preset pins
        # clang via its preset environment (TSan needs a compiler with full
        # annotation support, and clang pairs with libomp-dev for OpenMP).
        preset: [asan, ubsan, tsan]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v5
        with:
          path: build/${{ matrix.preset }}/_deps
          key: cmake-deps-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-${{ matrix.preset }}-
            cmake-deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libomp-dev

      - name: Configure
        run: cmake --preset=${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (benchmark label excluded via test preset)
        run: ctest --preset=${{ matrix.preset }}

  docs:
    name: Docs build & tests
    runs-on: ubuntu-latest
    env:
      VITEPRESS_BASE: /cpp-high-performance-guide/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        working-directory: docs
        run: npm ci

      - name: Run docs regression tests
        working-directory: docs
        run: npm test

      - name: Build docs
        working-directory: docs
        run: npm run build:pages
