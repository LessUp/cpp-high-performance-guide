name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check formatting
        run: ./scripts/format.sh --check

  linux-debug-gcc:
    name: Linux Debug (GCC)
    runs-on: ubuntu-latest
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/debug/_deps
            ~/.cache/ccache
          key: cmake-deps-${{ runner.os }}-gcc-debug-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-gcc-
            cmake-deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-12 g++-12 libomp-dev

      - name: Configure
        run: cmake --preset=debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset=debug

  linux-release-clang:
    name: Linux Release (Clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/release/_deps
            ~/.cache/ccache
          key: cmake-deps-${{ runner.os }}-clang-release-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-clang-
            cmake-deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libomp-dev

      - name: Configure
        run: cmake --preset=release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset=release

  macos-release:
    name: macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/release/_deps
            ~/Library/Caches/ccache
          key: cmake-deps-${{ runner.os }}-release-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-

      - name: Install dependencies
        run: brew install ninja libomp

      - name: Configure
        run: cmake --preset=release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset=release
