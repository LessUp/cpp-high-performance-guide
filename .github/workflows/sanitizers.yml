name: Sanitizers

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-12 g++-12 libomp-dev

      - name: Configure
        run: cmake --preset=asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset=asan

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libomp-dev

      - name: Configure
        run: cmake --preset=tsan

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        run: ctest --preset=tsan

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    env:
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-12 g++-12 libomp-dev

      - name: Configure
        run: cmake --preset=ubsan

      - name: Build
        run: cmake --build --preset ubsan

      - name: Test
        run: ctest --preset=ubsan
