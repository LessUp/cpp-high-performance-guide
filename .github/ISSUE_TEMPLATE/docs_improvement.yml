name: Documentation Improvement
title: "[Docs] "
labels: [documentation]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the documentation issue or improvement
    validations:
      required: true
  
  - type: input
    id: location
    attributes:
      label: Location
      description: Which file or section?

  - type: dropdown
    id: language
    attributes:
      label: Language scope
      options:
        - English only
        - Chinese only
        - Both English and Chinese
  
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Improvement
      description: How should it be improved?

  - type: textarea
    id: drift
    attributes:
      label: Drift or inconsistency
      description: Does the issue reflect drift between README, docs, OpenSpec, workflows, or code?
