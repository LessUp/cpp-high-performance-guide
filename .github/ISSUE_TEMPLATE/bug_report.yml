name: Bug Report
about: Create a report to help us improve
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Failing command or preset
      placeholder: "e.g., ctest --preset=debug"
  
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., Ubuntu 22.04"
  
  - type: input
    id: compiler
    attributes:
      label: Compiler
      placeholder: "e.g., GCC 11.4"
  
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output
      render: shell

  - type: input
    id: affected-module
    attributes:
      label: Affected module
      description: Which example module or include header does this affect, if known?
