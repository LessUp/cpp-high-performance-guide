name: cpp-high-performance-guide
version: 1
description: HPC optimization guide with OpenSpec-driven closure workflow
schema: spec-driven

context: |
  Tech stack: C++20, CMake 3.22+, Ninja
  Compilers: GCC 11+, Clang 14+ (MSVC best-effort)
  Dependencies: Google Benchmark, Google Test, RapidCheck (via FetchContent)
  Documentation: VitePress + GitHub Pages
  AI workflow: OpenSpec + AGENTS.md + CLAUDE.md + GitHub Copilot instructions
  Platforms: Linux (primary), macOS, Windows (best-effort)
  Maintenance posture: closure-focused, low-frequency future maintenance

  Project Structure:
  - examples/ - Optimization example modules
  - tests/ - Unit tests, property tests, integration tests
  - benchmarks/ - Performance benchmarks using Google Benchmark
  - docs/ - Bilingual documentation (zh/en)
  - cmake/ - CMake modules and utilities

  Key Features:
  - Memory and cache optimization (AOS/SOA, false sharing, alignment, prefetch)
  - Modern C++ features (constexpr, move semantics, ranges)
  - SIMD vectorization (auto-vectorization, SSE/AVX intrinsics)
  - Concurrency (atomic operations, lock-free structures, OpenMP)

  rules:
    specs:
      - Use SHALL/MUST for normative requirements
      - Each requirement must have at least one scenario
      - Scenarios use WHEN/THEN format with #### headers
      - Include performance-related scenarios where applicable
      - Keep capability scopes concrete and repository-specific
    tasks:
      - Tasks use checkbox format: `- [ ] X.Y Task description`
      - Group tasks under ## numbered headings
      - Order tasks by dependency
      - Prefer cleanup and normalization tasks over feature-expansion tasks
    design:
      - Include architecture diagrams using Mermaid
      - Document platform-specific behavior
      - Include performance considerations
      - Document any repo-structure or workflow cleanup explicitly
