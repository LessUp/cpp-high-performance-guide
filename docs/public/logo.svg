<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">C++ High Performance Guide logo</title>
  <desc id="logo-desc">A cobalt engineering badge with layered cache lines and a C++ monogram.</desc>
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#F5F7FB"/>
  <!-- Inner panel with gradient -->
  <rect x="56" y="56" width="400" height="400" rx="96" fill="url(#panel-light)" stroke="#D0DBF0" stroke-width="2"/>
  <!-- C block shape -->
  <path d="M152 160H296C337.974 160 372 194.026 372 236C372 277.974 337.974 312 296 312H152V160Z" fill="#1A3A7A" fill-opacity="0.06" stroke="#2A5FCC" stroke-width="20"/>
  <!-- Text lines inside C -->
  <path d="M192 208H300" stroke="#1A3A7A" stroke-width="24" stroke-linecap="round"/>
  <path d="M192 264H272" stroke="#1A3A7A" stroke-width="24" stroke-linecap="round"/>
  <!-- ++ symbols -->
  <path d="M348 206V266" stroke="#3B6BDC" stroke-width="18" stroke-linecap="round"/>
  <path d="M318 236H378" stroke="#3B6BDC" stroke-width="18" stroke-linecap="round"/>
  <path d="M404 206V266" stroke="#3B6BDC" stroke-width="18" stroke-linecap="round"/>
  <path d="M374 236H434" stroke="#3B6BDC" stroke-width="18" stroke-linecap="round"/>
  <!-- Cache line representations -->
  <rect x="112" y="352" width="288" height="16" rx="8" fill="#2A5FCC" fill-opacity="0.28"/>
  <rect x="112" y="384" width="208" height="16" rx="8" fill="#2A5FCC" fill-opacity="0.18"/>
  <defs>
    <linearGradient id="panel-light" x1="92" y1="92" x2="420" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8EDF8"/>
      <stop offset="1" stop-color="#DDE5F5"/>
    </linearGradient>
  </defs>
</svg>
